<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="Sample conversation with the assistant">
  <style>
    .t{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:16px;fill:#0f172a}
    .s{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:13px;fill:#64748b}
    .q{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:16px;fill:#ffffff}
    .chip{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:12px;font-weight:700;fill:#ffffff}
  </style>
  <rect width="1000" height="470" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="30" cy="26" r="6" fill="#f87171"/><circle cx="50" cy="26" r="6" fill="#fbbf24"/><circle cx="70" cy="26" r="6" fill="#34d399"/>
  <text x="500" y="31" text-anchor="middle" class="s">python -m assistant</text>

  <rect x="560" y="58" width="410" height="40" rx="14" fill="#2563eb"/><text x="580" y="84" class="q">When does my health insurance start?</text>
  <rect x="30" y="110" width="680" height="88" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="46" y="122" width="64" height="20" rx="10" fill="#0f766e"/><text x="78" y="136" text-anchor="middle" class="chip">ANSWER</text>
  <text x="46" y="164" class="t">Medical, dental and vision coverage starts on the first day of the</text>
  <text x="46" y="184" class="t">month after your start date.  <tspan class="s">source: benefits.md › Coverage start date</tspan></text>

  <rect x="580" y="214" width="390" height="40" rx="14" fill="#2563eb"/><text x="600" y="240" class="q">Will the company sponsor my H-1B visa?</text>
  <rect x="30" y="266" width="680" height="68" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="46" y="278" width="78" height="20" rx="10" fill="#b45309"/><text x="85" y="292" text-anchor="middle" class="chip">ESCALATE</text>
  <text x="134" y="293" class="s">immigration_or_visa</text>
  <text x="46" y="320" class="t">This is best handled by a person. I've flagged it for HR.</text>

  <rect x="680" y="350" width="290" height="40" rx="14" fill="#2563eb"/><text x="700" y="376" class="q">Is there a gym at the office?</text>
  <rect x="30" y="402" width="680" height="48" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="46" y="416" width="70" height="20" rx="10" fill="#475569"/><text x="81" y="430" text-anchor="middle" class="chip">ABSTAIN</text>
  <text x="128" y="431" class="t">I couldn't find this in the onboarding policies. Please ask HR.</text>
</svg>
